name: "🐛 Bug report / Reporte de bug"
description: "Something doesn't work as expected / Algo no funciona como debería"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! ✍️ You can write in **English or Spanish**.

        ⚠️ **A log file attachment is MANDATORY** — issues without it are closed automatically.

        📋 How to attach the log of your last run:
        1. Open `%AppData%\RealFenixFailures\logs\` (paste that path in the Windows address bar).
        2. Take the **most recent** `realfenix-<YYYYMMDD>.log` file (the one from the day of your last run) — the **complete file**, not an excerpt. Optionally remove personal data first.
        3. Drag & drop that `.log` file into the **Log file** field below (or into any field of this form). If GitHub rejects it, rename the copy to `.txt` and attach that.
        4. Submit and, if the issue is closed automatically, **edit it after attaching the file** — it will be reopened.

        ---

        ¡Gracias por tomarte el tiempo de reportar un bug! ✍️ Podés escribir en **inglés o español**.

        ⚠️ **El adjunto del log es OBLIGATORIO** — los issues sin el archivo se cierran automáticamente.

        📋 Cómo adjuntar el log de tu última ejecución:
        1. Abrí `%AppData%\RealFenixFailures\logs\` (pegá esa ruta en la barra de direcciones del Explorador).
        2. Tomá el archivo `realfenix-<AAAAMMDD>.log` **más reciente** (el del día de tu última ejecución) — el **archivo completo**, no un fragmento. Antes, borrá todo lo que consideres personal.
        3. Arrastrá y soltá ese `.log` en el campo **Log file** de abajo (o en cualquier campo del formulario). Si GitHub lo rechaza, renombrá la copia a `.txt` y adjuntá esa.
        4. Enviá y, si el issue se cierra solo, **editálo después de adjuntar el archivo** — se reabre solo.
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened? / ¿Qué pasó?"
      description: "A clear and concise description of the problem / Una descripción clara y concisa del problema."
      placeholder: "Describe the problem / Describí el problema"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / Pasos para reproducir"
      description: "What were you doing when it happened? Include the flight phase if relevant / ¿Qué estabas haciendo cuando pasó? Incluí la fase de vuelo si es relevante."
      placeholder: |
        1. Start the app with MSFS running / Arrancar la app con MSFS corriendo
        2. ... / ...
        3. ... / ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen? / ¿Qué esperabas que pasara?"
      placeholder: "Expected behavior / Comportamiento esperado"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "Which app mode? / ¿Qué modo de la app?"
      options:
        - "Realistic / Realista"
        - "Training / Entrenamiento"
        - "Custom / Personalizado"
        - "Not sure / No estoy seguro"
    validations:
      required: true
  - type: dropdown
    id: simulator
    attributes:
      label: "Which simulator? / ¿Qué simulador?"
      options:
        - "MSFS 2024"
        - "MSFS 2020"
        - "Both / Ambos"
        - "Not sure / No estoy seguro"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: "App version / Versión de la app"
      description: "Visible in the app window title or About info / Visible en la ventana de la app."
      placeholder: "e.g. / ej. v0.4.1-beta.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "📎 Log file (.log) — attach, do not paste / Archivo de log (.log) — adjuntá, no pegues"
      description: "Drag & drop the complete .log file of your last run here. Do NOT paste the content: issues without the attached file are closed automatically. / Arrastrá y soltá acá el archivo de log .log completo de tu última ejecución. NO pegues el contenido: los issues sin el archivo adjunto se cierran automáticamente."
      placeholder: "Nothing to write here — just drag & drop the .log file / Nada que escribir acá — solo arrastrá y soltá el archivo .log"
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Capturas de pantalla"
      description: "Drag & drop images here / Arrastrá y soltá imágenes acá."
  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist / Verificaciones"
      options:
        - label: "I searched existing issues and discussions for duplicates / Busqué issues y discussions similares antes de crear este reporte"
          required: true
        - label: "I attached the COMPLETE log file of my last execution (most recent realfenix-<YYYYMMDD>.log) / Adjunté el archivo COMPLETO del log de mi última ejecución (el realfenix-<AAAAMMDD>.log más reciente)"
          required: true
        - label: "I removed personal or sensitive information from the attached file / Borré información personal o sensible del archivo adjunto"
