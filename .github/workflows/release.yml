name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "Realistic Failures Solution/RealFenixFailures.slnx"

      - name: Build (Release)
        run: dotnet build "Realistic Failures Solution/RealFenixFailures.slnx" -c Release --no-restore

      - name: Test (gate del release)
        run: dotnet test "Realistic Failures Solution/RealFenixFailures.TestUnits/RealFenixFailures.TestUnits.csproj" -c Release --no-build

      - name: Publish (single-file, self-contained win-x64)
        run: >
          dotnet publish "Realistic Failures Solution/RealFenixFailures.UI/RealFenixFailures.UI.csproj"
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output "${{ runner.temp }}/RealFenixFailures-publish"

      - name: Arm ZIP portable (README + exe + SimConnect + appsettings, sin BD ni logs)
        shell: pwsh
        env:
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
        run: |
          $pub = Join-Path $env:RUNNER_TEMP "RealFenixFailures-publish"
          $stage = "$env:RUNNER_TEMP/RealFenixFailures"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in @("RealFenixFailures.exe", "Microsoft.FlightSimulator.SimConnect.dll", "SimConnect.dll", "appsettings.json")) {
            Copy-Item -LiteralPath (Join-Path $pub $f) -Destination $stage -ErrorAction Stop
          }
          if ($env:POSTHOG_PROJECT_API_KEY) {
            $settingsPath = Join-Path $stage "appsettings.json"
            $settings = Get-Content -LiteralPath $settingsPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($null -eq $settings.Telemetry) {
              $settings | Add-Member -Force -NotePropertyName Telemetry -NotePropertyValue ([pscustomobject]@{ Enabled = $true; PostHogProjectApiKey = ''; PostHogHost = 'https://us.i.posthog.com' })
            }
            $settings.Telemetry.PostHogProjectApiKey = $env:POSTHOG_PROJECT_API_KEY
            $settings | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $settingsPath -Encoding utf8
          }
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v0.0.0-test' }
          $readme = Join-Path $stage "README.md"
          Set-Content -LiteralPath $readme -Value "# FNX Realistic Failures System $tag`n" -Encoding utf8
          Add-Content -LiteralPath $readme -Value (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "docs/releases/README-INSTALACION.md") -Raw -Encoding utf8) -Encoding utf8
          # El README del ZIP lleva la guía de instalación + las notas de usuario del parche
          # (docs/releases/<tag>-user.md); si aún no existen, apunta a la página del release.
          $notesUser = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$tag-user.md"
          if (Test-Path $notesUser) {
            Add-Content -LiteralPath $readme -Value "---`n" -Encoding utf8
            Add-Content -LiteralPath $readme -Value (Get-Content -LiteralPath $notesUser -Raw -Encoding utf8) -Encoding utf8
          } else {
            Add-Content -LiteralPath $readme -Value "---`nLas notas de esta versión están en la página del release en GitHub." -Encoding utf8
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:RUNNER_TEMP/RealFenixFailures-$tag-win-x64.zip"

      - name: Subir ZIP como artefacto (solo ejecución manual de prueba)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-test
          path: ${{ runner.temp }}/RealFenixFailures-*-win-x64.zip

      - name: Crear GitHub Release con el ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Flag de prueba desactivada ("false" = flujo normal). El body del release sale de las notas
          # de usuario docs/releases/<tag>-user.md (o de las completas <tag>.md si faltan las user);
          # sin curadas, GitHub las genera (--generate-notes).
          FORCE_GENERATED_NOTES: "false"
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Join-Path $env:RUNNER_TEMP "RealFenixFailures-$tag-win-x64.zip"
          $userNotes = Join-Path "docs/releases" "$tag-user.md"
          $fullNotes = Join-Path "docs/releases" "$tag.md"
          $ghArgs = @('release', 'create', $tag, $zip, '--target', 'master', '--title', $tag)
          # Body del release = notas de usuario (<tag>-user.md); si faltan, las completas (<tag>.md);
          # sin curadas, --generate-notes. Al final del body curado se agrega el link a Announcements,
          # donde se publica a mano el announcement con las notas completas.
          $srcNotes = $null
          if (Test-Path $userNotes) { $srcNotes = $userNotes } elseif (Test-Path $fullNotes) { $srcNotes = $fullNotes }
          if ($env:FORCE_GENERATED_NOTES -ne 'true' -and $srcNotes) {
            $annUrl = "https://github.com/$env:GITHUB_REPOSITORY/discussions/categories/announcements"
            $body = (Get-Content -LiteralPath $srcNotes -Raw -Encoding utf8) + "`n`n---`n➡️ Full patch notes / Notas completas del parche: $annUrl"
            $bodyFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
            Set-Content -LiteralPath $bodyFile -Value $body -Encoding utf8
            $ghArgs += @('--notes-file', $bodyFile)
          } else {
            $ghArgs += '--generate-notes'
          }
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
