name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "Realistic Failures Solution/RealFenixFailures.slnx"

      - name: Build (Release)
        run: dotnet build "Realistic Failures Solution/RealFenixFailures.slnx" -c Release --no-restore

      - name: Test (gate del release)
        run: dotnet test "Realistic Failures Solution/RealFenixFailures.TestUnits/RealFenixFailures.TestUnits.csproj" -c Release --no-build

      - name: Publish (single-file, self-contained win-x64)
        run: >
          dotnet publish "Realistic Failures Solution/RealFenixFailures.UI/RealFenixFailures.UI.csproj"
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output "${{ runner.temp }}/RealFenixFailures-publish"

      - name: Arm ZIP portable (README + exe + SimConnect + appsettings, sin BD ni logs)
        shell: pwsh
        env:
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
        run: |
          $pub = Join-Path $env:RUNNER_TEMP "RealFenixFailures-publish"
          $stage = "$env:RUNNER_TEMP/RealFenixFailures"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in @("RealFenixFailures.exe", "Microsoft.FlightSimulator.SimConnect.dll", "SimConnect.dll", "appsettings.json")) {
            Copy-Item -LiteralPath (Join-Path $pub $f) -Destination $stage -ErrorAction Stop
          }
          if ($env:POSTHOG_PROJECT_API_KEY) {
            $settingsPath = Join-Path $stage "appsettings.json"
            $settings = Get-Content -LiteralPath $settingsPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($null -eq $settings.Telemetry) {
              $settings | Add-Member -Force -NotePropertyName Telemetry -NotePropertyValue ([pscustomobject]@{ Enabled = $true; PostHogProjectApiKey = ''; PostHogHost = 'https://us.i.posthog.com' })
            }
            $settings.Telemetry.PostHogProjectApiKey = $env:POSTHOG_PROJECT_API_KEY
            $settings | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $settingsPath -Encoding utf8
          }
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v0.0.0-test' }
          $readme = Join-Path $stage "README.md"
          Set-Content -LiteralPath $readme -Value "# FNX Realistic Failures System $tag`n" -Encoding utf8
          Add-Content -LiteralPath $readme -Value (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "docs/releases/README-INSTALACION.md") -Raw -Encoding utf8) -Encoding utf8
          $notes = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$tag.md"
          if (Test-Path $notes) {
            Add-Content -LiteralPath $readme -Value "---`n" -Encoding utf8
            Add-Content -LiteralPath $readme -Value (Get-Content -LiteralPath $notes -Raw -Encoding utf8) -Encoding utf8
          } else {
            Add-Content -LiteralPath $readme -Value "---`nLas notas de esta versión están en la página del release en GitHub." -Encoding utf8
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:RUNNER_TEMP/RealFenixFailures-$tag-win-x64.zip"

      - name: Subir ZIP como artefacto (solo ejecución manual de prueba)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-test
          path: ${{ runner.temp }}/RealFenixFailures-*-win-x64.zip

      - name: Crear GitHub Release con el ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Join-Path $env:RUNNER_TEMP "RealFenixFailures-$tag-win-x64.zip"
          $notes = Join-Path "docs/releases" "$tag.md"
          $ghArgs = @('release', 'create', $tag, $zip, '--target', 'master', '--title', $tag)
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs

      - name: Anunciar el release en Discussions (Announcements)
        # Solo corre si el release se publicó OK (los pasos previos fallan antes de llegar acá).
        # Best-effort: un fallo del anuncio no marca el release como fallido.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $notes = Join-Path "docs/releases" "$tag.md"
          if (Test-Path $notes) { $body = Get-Content -LiteralPath $notes -Raw -Encoding utf8 } else { $body = gh release view $tag --json body -q .body }
          $body += "`n`n➡️ Download / Descarga: https://github.com/$repo/releases/tag/$tag"
          # Crear discussions es GraphQL-only: primero los node IDs del repo y la categoría Announcements.
          $owner, $name = $repo -split '/'
          $ids = gh api graphql -f query='query($owner:String!,$name:String!){ repository(owner:$owner,name:$name){ id discussionCategories(first:10){ nodes{ id name } } } }' -f owner=$owner -f name=$name
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron leer los IDs de Discussions (gh exit $LASTEXITCODE)" }
          $ids = $ids | ConvertFrom-Json
          $category = $ids.data.repository.discussionCategories.nodes | Where-Object { $_.name -eq 'Announcements' }
          if (-not $category) { throw 'Categoria Announcements no encontrada en Discussions' }
          # El flag "announcement" del post no se expone por API: el post queda en la categoría; marcarlo es manual.
          # rid/cid son ID! (no String!): GraphQL los rechaza si se declaran String! aunque viajen como string.
          $result = gh api graphql -f query='mutation($rid:ID!,$cid:ID!,$title:String!,$body:String!){ createDiscussion(input:{repositoryId:$rid,categoryId:$cid,title:$title,body:$body}){ discussion{ url } } }' -f rid=$ids.data.repository.id -f cid=$category.id -f title="$tag released" -f body=$body
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la discussion (gh exit $LASTEXITCODE)" }
          $result = $result | ConvertFrom-Json
          $url = $result.data.createDiscussion.discussion.url
          if (-not $url) { throw "createDiscussion no devolvio URL: $($result | ConvertTo-Json -Depth 5)" }
          Write-Output "Announcement creado: $url"
