name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (single-file, self-contained win-x64)
        run: >
          dotnet publish "Realistic Failures Solution/RealFenixFailures.UI/RealFenixFailures.UI.csproj"
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output "${{ runner.temp }}/RealFenixFailures-publish"

      - name: Arm ZIP portable (README + exe + SimConnect + appsettings, sin BD ni logs)
        shell: pwsh
        run: |
          $pub = Join-Path $env:RUNNER_TEMP "RealFenixFailures-publish"
          $stage = "$env:RUNNER_TEMP/RealFenixFailures"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in @("RealFenixFailures.UI.exe", "Microsoft.FlightSimulator.SimConnect.dll", "SimConnect.dll", "appsettings.json")) {
            Copy-Item -LiteralPath (Join-Path $pub $f) -Destination $stage -ErrorAction Stop
          }
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v0.0.0-test' }
          $readme = Join-Path $stage "README.md"
          Set-Content -LiteralPath $readme -Value "# FNX Realistic Failures System $tag`n" -Encoding utf8
          Add-Content -LiteralPath $readme -Value (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "docs/releases/README-INSTALACION.md") -Raw -Encoding utf8) -Encoding utf8
          $notes = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$tag.md"
          if (Test-Path $notes) {
            Add-Content -LiteralPath $readme -Value "---`n" -Encoding utf8
            Add-Content -LiteralPath $readme -Value (Get-Content -LiteralPath $notes -Raw -Encoding utf8) -Encoding utf8
          } else {
            Add-Content -LiteralPath $readme -Value "---`nLas notas de esta versión están en la página del release en GitHub." -Encoding utf8
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:RUNNER_TEMP/RealFenixFailures-$tag-win-x64.zip"

      - name: Subir ZIP como artefacto (solo ejecución manual de prueba)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-zip-test
          path: ${{ runner.temp }}/RealFenixFailures-*-win-x64.zip

      - name: Crear GitHub Release con el ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Join-Path $env:RUNNER_TEMP "RealFenixFailures-$tag-win-x64.zip"
          $notes = Join-Path "docs/releases" "$tag.md"
          $ghArgs = @('release', 'create', $tag, $zip, '--target', 'master', '--title', $tag)
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
